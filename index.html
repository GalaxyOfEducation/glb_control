<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض المجسم - التحكم بالأجزاء</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }
        
        #main-container { display: flex; height: 100vh; }
        
        #control-panel {
            width: 320px;
            background: #16213e;
            padding: 15px;
            overflow-y: auto;
            border-left: 2px solid #0f3460;
        }
        
        #control-panel h2 {
            color: #e94560;
            margin-bottom: 15px;
            font-size: 18px;
            text-align: center;
            border-bottom: 2px solid #0f3460;
            padding-bottom: 10px;
        }
        
        .part-control {
            background: #0f3460;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }
        
        .part-control:hover { background: #1a4a7a; }
        
        .part-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .part-name {
            font-weight: bold;
            color: #fff;
            font-size: 13px;
            word-break: break-all;
        }
        
        .visibility-toggle {
            cursor: pointer;
            background: #e94560;
            border: none;
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
        }
        
        .visibility-toggle.hidden { background: #666; }
        
        .slider-group {
            margin: 6px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .slider-group label {
            font-size: 11px;
            width: 50px;
            color: #aaa;
        }
        
        .slider-group input[type="range"] {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            background: #333;
            border-radius: 3px;
            outline: none;
        }
        
        .slider-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #e94560;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .slider-value {
            font-size: 11px;
            width: 40px;
            text-align: left;
            color: #e94560;
        }
        
        .color-picker {
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .color-picker label { font-size: 11px; color: #aaa; }
        
        .color-picker input[type="color"] {
            width: 40px;
            height: 25px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .reset-btn {
            margin-top: 8px;
            width: 100%;
            padding: 6px;
            background: #333;
            border: 1px solid #555;
            color: #aaa;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .reset-btn:hover { background: #444; color: #fff; }
        
        #canvas-container {
            flex: 1;
            position: relative;
        }
        
        #info-bar {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 12px;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #e94560;
        }
        
        .global-controls {
            margin-bottom: 15px;
            padding: 10px;
            background: #1a1a2e;
            border-radius: 8px;
        }
        
        .global-controls button {
            width: 100%;
            padding: 8px;
            margin: 3px 0;
            background: #0f3460;
            border: 1px solid #e94560;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .global-controls button:hover { background: #e94560; }
        
        #debug-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.85);
            color: #0f0;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
            max-height: 250px;
            overflow-y: auto;
            white-space: pre-line;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div id="main-container">
        <div id="control-panel">
            <h2>🎛️ التحكم بالأجزاء</h2>
            
            <div class="global-controls">
                <button onclick="showAllParts()">📋 إظهار الكل</button>
                <button onclick="hideAllParts()">👁️ إخفاء الكل</button>
                <button onclick="resetAllPositions()">🔄 إعادة تعيين</button>
                <button onclick="explodeView()">💥 عرض منفصل</button>
            </div>
            
            <div id="parts-list"></div>
        </div>
        
        <div id="canvas-container">
            <div id="loading">جاري التحميل...</div>
            <div id="info-bar">
                <div>🖱️ يسار: تدوير | 🖱️ يمين: تحريك | 🖱️ عجلة: تكبير</div>
            </div>
            <div id="debug-info"></div>
        </div>
    </div>

    <script>
        // ============================================
        // إعدادات - عدّل المسار حسب مشروعك
        // ============================================
        const MODEL_PATH = 'models/heli.glb';
        
        // أسماء الأجزاء من الصورة
        const EXPECTED_PARTS = [
            '500_D_cristal_1_VL',
            '500_D_cristal_2_VL',
            '500_D_cristal_3_VL',
            '500_D_cristal_4_VL',
            '500_D_cristales_front',
            '500_D_cristales_supe',
            '500_D_fuselaje__VL',
            '500_D_PALAS_VL',
            '500_D_ROTOR_DE_C'
        ];
        
        let scene, camera, renderer, controls;
        let parts = {};
        let originalPositions = {};
        let isExploded = false;
        
        function log(msg) {
            console.log(msg);
            const debug = document.getElementById('debug-info');
            debug.textContent += msg + '\n';
            debug.scrollTop = debug.scrollHeight;
        }
        
        // ============================================
        // التهيئة
        // ============================================
        function init() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            
            camera = new THREE.PerspectiveCamera(
                45, 
                container.clientWidth / container.clientHeight, 
                0.1, 
                1000
            );
            camera.position.set(10, 10, 10);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);
            
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, 2, 0);
            
            // إضاءة
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);
            
            const backLight = new THREE.DirectionalLight(0x4444ff, 0.3);
            backLight.position.set(-10, 5, -10);
            scene.add(backLight);
            
            // شبكة أرضية
            const gridHelper = new THREE.GridHelper(30, 30, 0x444444, 0x222222);
            scene.add(gridHelper);
            
            // محاور
            const axesHelper = new THREE.AxesHelper(5);
            scene.add(axesHelper);
            
            loadModel();
            
            window.addEventListener('resize', onWindowResize);
            animate();
        }
        
        // ============================================
        // تحميل الملف
        // ============================================
        function loadModel() {
            const loader = new THREE.GLTFLoader();
            
            log('جاري تحميل: ' + MODEL_PATH);
            
            loader.load(MODEL_PATH, function(gltf) {
                log('✅ تم تحميل الملف بنجاح!');
                
                const model = gltf.scene;
                scene.add(model);
                
                extractParts(model);
                
                document.getElementById('loading').style.display = 'none';
                
            }, function(progress) {
                const percent = Math.round((progress.loaded / progress.total) * 100);
                document.getElementById('loading').textContent = 'جاري التحميل... ' + percent + '%';
                
            }, function(error) {
                log('❌ خطأ في التحميل: ' + error.message);
                document.getElementById('loading').textContent = 'خطأ في التحميل!';
                document.getElementById('loading').style.color = '#ff4444';
            });
        }
        
        // ============================================
        // استخراج الأجزاء
        // ============================================
        function extractParts(model) {
            let foundCount = 0;
            const allNames = [];
            
            model.traverse(function(child) {
                if (child.name && child.name.trim() !== '') {
                    allNames.push(child.name);
                }
                
                // البحث عن الأجزاء المعروفة
                for (const partName of EXPECTED_PARTS) {
                    if (child.name === partName) {
                        if (!parts[partName]) {
                            parts[partName] = child;
                            foundCount++;
                            
                            log('✓ وجدت: ' + partName);
                            
                            originalPositions[partName] = {
                                x: child.position.x,
                                y: child.position.y,
                                z: child.position.z,
                                rx: child.rotation.x,
                                ry: child.rotation.y,
                                rz: child.rotation.z,
                                sx: child.scale.x,
                                sy: child.scale.y,
                                sz: child.scale.z
                            };
                            
                            createPartControl(partName);
                        }
                        break;
                    }
                }
            });
            
            log('---');
            log('الأجزاء المتوقعة: ' + EXPECTED_PARTS.length);
            log('الأجزاء التي وجدت: ' + foundCount);
            log('إجمالي العناصر: ' + allNames.length);
            
            // إذا لم نجد أجزاء، نعرض كل الأسماء
            if (foundCount === 0) {
                log('⚠️ لم أجد أجزاء! الأسماء الموجودة:');
                allNames.forEach(n => log('  - ' + n));
                
                // محاولة ثانية: البحث بـ includes
                log('---');
                log('محاولة بحث مرنة...');
                model.traverse(function(child) {
                    if (child.name && child.name.trim() !== '') {
                        for (const partName of EXPECTED_PARTS) {
                            if (child.name.toLowerCase().includes(partName.toLowerCase()) ||
                                partName.toLowerCase().includes(child.name.toLowerCase())) {
                                if (!parts[partName]) {
                                    parts[partName] = child;
                                    foundCount++;
                                    log('✓ (مرن) وجدت: ' + partName + ' = ' + child.name);
                                    
                                    originalPositions[partName] = {
                                        x: child.position.x,
                                        y: child.position.y,
                                        z: child.position.z,
                                        rx: child.rotation.x,
                                        ry: child.rotation.y,
                                        rz: child.rotation.z,
                                        sx: child.scale.x,
                                        sy: child.scale.y,
                                        sz: child.scale.z
                                    };
                                    
                                    createPartControl(partName);
                                }
                                break;
                            }
                        }
                    }
                });
            }
            
            // توسيط الكاميرا
            if (foundCount > 0) {
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                
                controls.target.copy(center);
                
                const maxDim = Math.max(size.x, size.y, size.z);
                const fov = camera.fov * (Math.PI / 180);
                let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
                cameraZ *= 3;
                
                camera.position.set(center.x + cameraZ/2, center.y + cameraZ/2, center.z + cameraZ);
                camera.lookAt(center);
                
                log('حجم المجسم: ' + size.x.toFixed(2) + ' x ' + size.y.toFixed(2) + ' x ' + size.z.toFixed(2));
            }
        }
        
        // ============================================
        // إنشاء عنصر تحكم
        // ============================================
        function createPartControl(partName) {
            const container = document.getElementById('parts-list');
            
            const div = document.createElement('div');
            div.className = 'part-control';
            div.id = 'control-' + partName.replace(/[^a-zA-Z0-9]/g, '_');
            
            const safeName = partName.replace(/"/g, '&quot;');
            
            div.innerHTML = `
                <div class="part-header">
                    <span class="part-name">${partName}</span>
                    <button class="visibility-toggle" id="btn-${safeName}" onclick="toggleVisibility('${safeName}')">
                        إخفاء
                    </button>
                </div>
                
                <div class="slider-group">
                    <label>موقع X</label>
                    <input type="range" min="-20" max="20" step="0.1" value="0" 
                        oninput="updatePosition('${safeName}', 'x', this.value)">
                    <span class="slider-value" id="val-x-${safeName}">0</span>
                </div>
                
                <div class="slider-group">
                    <label>موقع Y</label>
                    <input type="range" min="-20" max="20" step="0.1" value="0" 
                        oninput="updatePosition('${safeName}', 'y', this.value)">
                    <span class="slider-value" id="val-y-${safeName}">0</span>
                </div>
                
                <div class="slider-group">
                    <label>موقع Z</label>
                    <input type="range" min="-20" max="20" step="0.1" value="0" 
                        oninput="updatePosition('${safeName}', 'z', this.value)">
                    <span class="slider-value" id="val-z-${safeName}">0</span>
                </div>
                
                <div class="slider-group">
                    <label>تدوير Y</label>
                    <input type="range" min="0" max="360" step="1" value="0" 
                        oninput="updateRotation('${safeName}', 'y', this.value)">
                    <span class="slider-value" id="val-ry-${safeName}">0°</span>
                </div>
                
                <div class="slider-group">
                    <label>حجم</label>
                    <input type="range" min="0.1" max="3" step="0.1" value="1" 
                        oninput="updateScale('${safeName}', this.value)">
                    <span class="slider-value" id="val-s-${safeName}">1</span>
                </div>
                
                <div class="color-picker">
                    <label>اللون:</label>
                    <input type="color" value="#ffffff" onchange="updateColor('${safeName}', this.value)">
                </div>
                
                <button class="reset-btn" onclick="resetPart('${safeName}')">
                    🔄 إعادة تعيين
                </button>
            `;
            
            container.appendChild(div);
        }
        
        // ============================================
        // دوال التحكم
        // ============================================
        function toggleVisibility(name) {
            if (parts[name]) {
                parts[name].visible = !parts[name].visible;
                const btn = document.getElementById('btn-' + name);
                if (parts[name].visible) {
                    btn.textContent = 'إخفاء';
                    btn.classList.remove('hidden');
                } else {
                    btn.textContent = 'إظهار';
                    btn.classList.add('hidden');
                }
            }
        }
        
        function updatePosition(name, axis, value) {
            if (parts[name]) {
                parts[name].position[axis] = parseFloat(value);
                document.getElementById('val-' + axis + '-' + name).textContent = value;
            }
        }
        
        function updateRotation(name, axis, value) {
            if (parts[name]) {
                parts[name].rotation[axis] = THREE.MathUtils.degToRad(parseFloat(value));
                document.getElementById('val-r' + axis + '-' + name).textContent = value + '°';
            }
        }
        
        function updateScale(name, value) {
            if (parts[name]) {
                const s = parseFloat(value);
                parts[name].scale.set(s, s, s);
                document.getElementById('val-s-' + name).textContent = value;
            }
        }
        
        function updateColor(name, colorValue) {
            if (parts[name]) {
                parts[name].traverse(function(child) {
                    if (child.isMesh && child.material) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach(m => m.color.set(colorValue));
                        } else {
                            child.material.color.set(colorValue);
                        }
                    }
                });
            }
        }
        
        function resetPart(name) {
            if (parts[name] && originalPositions[name]) {
                const orig = originalPositions[name];
                parts[name].position.set(orig.x, orig.y, orig.z);
                parts[name].rotation.set(orig.rx, orig.ry, orig.rz);
                parts[name].scale.set(orig.sx, orig.sy, orig.sz);
                parts[name].visible = true;
                
                const controlId = 'control-' + name.replace(/[^a-zA-Z0-9]/g, '_');
                const control = document.getElementById(controlId);
                if (control) {
                    control.querySelectorAll('input[type="range"]').forEach(input => {
                        const oninput = input.getAttribute('oninput') || '';
                        if (oninput.includes('Position')) input.value = 0;
                        else if (oninput.includes('Rotation')) input.value = 0;
                        else if (oninput.includes('Scale')) input.value = 1;
                    });
                }
                
                const btn = document.getElementById('btn-' + name);
                if (btn) {
                    btn.textContent = 'إخفاء';
                    btn.classList.remove('hidden');
                }
            }
        }
        
        function showAllParts() {
            Object.keys(parts).forEach(name => {
                if (parts[name]) parts[name].visible = true;
                const btn = document.getElementById('btn-' + name);
                if (btn) {
                    btn.textContent = 'إخفاء';
                    btn.classList.remove('hidden');
                }
            });
        }
        
        function hideAllParts() {
            Object.keys(parts).forEach(name => {
                if (parts[name]) parts[name].visible = false;
                const btn = document.getElementById('btn-' + name);
                if (btn) {
                    btn.textContent = 'إظهار';
                    btn.classList.add('hidden');
                }
            });
        }
        
        function resetAllPositions() {
            Object.keys(parts).forEach(name => resetPart(name));
            isExploded = false;
        }
        
        function explodeView() {
            if (!isExploded) {
                const keys = Object.keys(parts);
                keys.forEach((name, index) => {
                    if (parts[name]) {
                        const angle = (index / keys.length) * Math.PI * 2;
                        const radius = 5;
                        parts[name].position.x += Math.cos(angle) * radius;
                        parts[name].position.z += Math.sin(angle) * radius;
                        parts[name].position.y += index * 0.5;
                    }
                });
                isExploded = true;
            } else {
                resetAllPositions();
            }
        }
        
        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        init();
    </script>
</body>
</html>
