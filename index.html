<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض المجسم - التحكم بالأجزاء</title>
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }
        
        #main-container {
            display: flex;
            height: 100vh;
        }
        
        /* لوحة التحكم */
        #control-panel {
            width: 320px;
            background: #16213e;
            padding: 15px;
            overflow-y: auto;
            border-left: 2px solid #0f3460;
        }
        
        #control-panel h2 {
            color: #e94560;
            margin-bottom: 15px;
            font-size: 18px;
            text-align: center;
            border-bottom: 2px solid #0f3460;
            padding-bottom: 10px;
        }
        
        .part-control {
            background: #0f3460;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }
        
        .part-control:hover {
            background: #1a4a7a;
        }
        
        .part-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .part-name {
            font-weight: bold;
            color: #fff;
            font-size: 14px;
        }
        
        .visibility-toggle {
            cursor: pointer;
            background: #e94560;
            border: none;
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .visibility-toggle.hidden {
            background: #666;
        }
        
        .slider-group {
            margin: 6px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .slider-group label {
            font-size: 11px;
            width: 30px;
            color: #aaa;
        }
        
        .slider-group input[type="range"] {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            background: #333;
            border-radius: 3px;
            outline: none;
        }
        
        .slider-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #e94560;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .slider-value {
            font-size: 11px;
            width: 40px;
            text-align: left;
            color: #e94560;
        }
        
        .color-picker {
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .color-picker label {
            font-size: 11px;
            color: #aaa;
        }
        
        .color-picker input[type="color"] {
            width: 40px;
            height: 25px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .reset-btn {
            margin-top: 8px;
            width: 100%;
            padding: 6px;
            background: #333;
            border: 1px solid #555;
            color: #aaa;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .reset-btn:hover {
            background: #444;
            color: #fff;
        }
        
        /* منطقة العرض */
        #canvas-container {
            flex: 1;
            position: relative;
        }
        
        #info-bar {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 12px;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #e94560;
        }
        
        .global-controls {
            margin-bottom: 15px;
            padding: 10px;
            background: #1a1a2e;
            border-radius: 8px;
        }
        
        .global-controls button {
            width: 100%;
            padding: 8px;
            margin: 3px 0;
            background: #0f3460;
            border: 1px solid #e94560;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .global-controls button:hover {
            background: #e94560;
        }
    </style>
</head>
<body>
    <div id="main-container">
        <!-- لوحة التحكم -->
        <div id="control-panel">
            <h2>🎛️ التحكم بالأجزاء</h2>
            
            <div class="global-controls">
                <button onclick="showAllParts()">📋 إظهار الكل</button>
                <button onclick="hideAllParts()">👁️ إخفاء الكل</button>
                <button onclick="resetAllPositions()">🔄 إعادة تعيين المواقع</button>
                <button onclick="explodeView()">💥 عرض منفصل (Explode)</button>
            </div>
            
            <div id="parts-list">
                <!-- سيتم إنشاؤها ديناميكياً -->
            </div>
        </div>
        
        <!-- منطقة عرض المجسم -->
        <div id="canvas-container">
            <div id="loading">جاري التحميل...</div>
            <div id="info-bar">
                <div>🖱️ يسار: تدوير | 🖱️ يمين: تحريك | 🖱️ عجلة: تكبير</div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // إعدادات - عدّل المسارات حسب مشروعك
        // ============================================
        
        // الخيار 1: ملف واحد يحتوي كل الأجزاء
        const MODEL_PATH = 'models/AMK.glb';
        
        // الخيار 2: ملفات منفصلة لكل جزء (أفضل للتحكم)
        const PARTS_CONFIG = [
            { name: 'amkanill', path: 'models/amkanill.glb', label: 'الجزء 1' },
            { name: 'amkarco', path: 'models/amkarco.glb', label: 'الجزء 2' },
            { name: 'amkbase', path: 'models/amkbase.glb', label: 'القاعدة' },
            { name: 'amkbloc', path: 'models/amkbloc.glb', label: 'البلوك' },
            { name: 'amkcao', path: 'models/amkcao.glb', label: 'الجزء 5' },
            { name: 'amkeje', path: 'models/amkeje.glb', label: 'الجزء 6' },
            { name: 'amkesta', path: 'models/amkesta.glb', label: 'الجزء 7' },
            { name: 'amkgua1', path: 'models/amkgua1.glb', label: 'الجزء 8' },
            { name: 'amkgua2', path: 'models/amkgua2.glb', label: 'الجزء 9' },
            { name: 'amklla1', path: 'models/amklla1.glb', label: 'الجزء 10' },
            { name: 'amklla2', path: 'models/amklla2.glb', label: 'الجزء 11' },
            { name: 'amknem1', path: 'models/amknem1.glb', label: 'الجزء 12' },
            { name: 'amknem2', path: 'models/amknem2.glb', label: 'الجزء 13' },
            { name: 'amkppla', path: 'models/amkppla.glb', label: 'الجزء 14' },
            { name: 'amkpro', path: 'models/amkpro.glb', label: 'الجزء 15' },
            { name: 'amkprod', path: 'models/amkprod.glb', label: 'الجزء 16' }
        ];
        
        // ============================================
        // متغيرات Three.js
        // ============================================
        let scene, camera, renderer, controls;
        let parts = {}; // تخزين كل جزء
        let originalPositions = {}; // المواقع الأصلية
        
        // ============================================
        // التهيئة
        // ============================================
        function init() {
            const container = document.getElementById('canvas-container');
            
            // المشهد
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            scene.fog = new THREE.Fog(0x1a1a2e, 10, 50);
            
            // الكاميرا
            camera = new THREE.PerspectiveCamera(
                45, 
                container.clientWidth / container.clientHeight, 
                0.1, 
                1000
            );
            camera.position.set(8, 6, 8);
            
            // الرندر
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);
            
            // التحكم
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 1, 0);
            
            // الإضاءة
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 5);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);
            
            const fillLight = new THREE.DirectionalLight(0x4444ff, 0.3);
            fillLight.position.set(-5, 2, -5);
            scene.add(fillLight);
            
            // شبكة أرضية
            const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
            scene.add(gridHelper);
            
            // تحميل الأجزاء
            loadAllParts();
            
            // التكيف مع تغيير الحجم
            window.addEventListener('resize', onWindowResize);
            
            // حلقة الرسم
            animate();
        }
        
        // ============================================
        // تحميل الأجزاء
        // ============================================
        function loadAllParts() {
            const loader = new THREE.GLTFLoader();
            let loadedCount = 0;
            const totalParts = PARTS_CONFIG.length;
            
            PARTS_CONFIG.forEach((partConfig, index) => {
                loader.load(partConfig.path, function(gltf) {
                    const model = gltf.scene;
                    
                    // تسمية الجزء
                    model.name = partConfig.name;
                    
                    // تفعيل الظلال
                    model.traverse(function(child) {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });
                    
                    // حفظ الموقع الأصلي
                    originalPositions[partConfig.name] = {
                        x: model.position.x,
                        y: model.position.y,
                        z: model.position.z,
                        rx: model.rotation.x,
                        ry: model.rotation.y,
                        rz: model.rotation.z
                    };
                    
                    // إضافة للمشهد
                    scene.add(model);
                    parts[partConfig.name] = model;
                    
                    // إنشاء عنصر تحكم
                    createPartControl(partConfig);
                    
                    loadedCount++;
                    if (loadedCount === totalParts) {
                        document.getElementById('loading').style.display = 'none';
                    }
                }, undefined, function(error) {
                    console.error('خطأ في تحميل ' + partConfig.name + ':', error);
                    loadedCount++;
                });
            });
        }
        
        // ============================================
        // إنشاء عنصر تحكم لكل جزء
        // ============================================
        function createPartControl(config) {
            const container = document.getElementById('parts-list');
            const name = config.name;
            
            const div = document.createElement('div');
            div.className = 'part-control';
            div.id = 'control-' + name;
            
            div.innerHTML = `
                <div class="part-header">
                    <span class="part-name">${config.label} (${name})</span>
                    <button class="visibility-toggle" id="btn-${name}" onclick="toggleVisibility('${name}')">
                        إخفاء
                    </button>
                </div>
                
                <div class="slider-group">
                    <label>موقع X</label>
                    <input type="range" min="-10" max="10" step="0.1" value="0" 
                        oninput="updatePosition('${name}', 'x', this.value)">
                    <span class="slider-value" id="val-x-${name}">0</span>
                </div>
                
                <div class="slider-group">
                    <label>موقع Y</label>
                    <input type="range" min="-10" max="10" step="0.1" value="0" 
                        oninput="updatePosition('${name}', 'y', this.value)">
                    <span class="slider-value" id="val-y-${name}">0</span>
                </div>
                
                <div class="slider-group">
                    <label>موقع Z</label>
                    <input type="range" min="-10" max="10" step="0.1" value="0" 
                        oninput="updatePosition('${name}', 'z', this.value)">
                    <span class="slider-value" id="val-z-${name}">0</span>
                </div>
                
                <div class="slider-group">
                    <label>تدوير Y</label>
                    <input type="range" min="0" max="360" step="1" value="0" 
                        oninput="updateRotation('${name}', 'y', this.value)">
                    <span class="slider-value" id="val-ry-${name}">0°</span>
                </div>
                
                <div class="slider-group">
                    <label>حجم</label>
                    <input type="range" min="0.1" max="3" step="0.1" value="1" 
                        oninput="updateScale('${name}', this.value)">
                    <span class="slider-value" id="val-s-${name}">1</span>
                </div>
                
                <div class="color-picker">
                    <label>اللون:</label>
                    <input type="color" value="#ffffff" onchange="updateColor('${name}', this.value)">
                </div>
                
                <button class="reset-btn" onclick="resetPart('${name}')">
                    🔄 إعادة تعيين
                </button>
            `;
            
            container.appendChild(div);
        }
        
        // ============================================
        // دوال التحكم
        // ============================================
        
        // تبديل الظهور
        function toggleVisibility(name) {
            if (parts[name]) {
                parts[name].visible = !parts[name].visible;
                const btn = document.getElementById('btn-' + name);
                if (parts[name].visible) {
                    btn.textContent = 'إخفاء';
                    btn.classList.remove('hidden');
                } else {
                    btn.textContent = 'إظهار';
                    btn.classList.add('hidden');
                }
            }
        }
        
        // تحديث الموقع
        function updatePosition(name, axis, value) {
            if (parts[name]) {
                parts[name].position[axis] = parseFloat(value);
                document.getElementById('val-' + axis + '-' + name).textContent = value;
            }
        }
        
        // تحديث التدوير
        function updateRotation(name, axis, value) {
            if (parts[name]) {
                parts[name].rotation[axis] = THREE.MathUtils.degToRad(parseFloat(value));
                document.getElementById('val-r' + axis + '-' + name).textContent = value + '°';
            }
        }
        
        // تحديث الحجم
        function updateScale(name, value) {
            if (parts[name]) {
                const s = parseFloat(value);
                parts[name].scale.set(s, s, s);
                document.getElementById('val-s-' + name).textContent = value;
            }
        }
        
        // تحديث اللون
        function updateColor(name, colorValue) {
            if (parts[name]) {
                parts[name].traverse(function(child) {
                    if (child.isMesh && child.material) {
                        child.material.color.set(colorValue);
                    }
                });
            }
        }
        
        // إعادة تعيين جزء واحد
        function resetPart(name) {
            if (parts[name] && originalPositions[name]) {
                const orig = originalPositions[name];
                parts[name].position.set(orig.x, orig.y, orig.z);
                parts[name].rotation.set(orig.rx, orig.ry, orig.rz);
                parts[name].scale.set(1, 1, 1);
                parts[name].visible = true;
                
                // إعادة تعيين الـ UI
                const control = document.getElementById('control-' + name);
                control.querySelectorAll('input[type="range"]').forEach(input => {
                    if (input.getAttribute('oninput').includes('Position')) {
                        input.value = 0;
                    } else if (input.getAttribute('oninput').includes('Rotation')) {
                        input.value = 0;
                    } else if (input.getAttribute('oninput').includes('Scale')) {
                        input.value = 1;
                    }
                });
            }
        }
        
        // إظهار الكل
        function showAllParts() {
            Object.keys(parts).forEach(name => {
                parts[name].visible = true;
                const btn = document.getElementById('btn-' + name);
                btn.textContent = 'إخفاء';
                btn.classList.remove('hidden');
            });
        }
        
        // إخفاء الكل
        function hideAllParts() {
            Object.keys(parts).forEach(name => {
                parts[name].visible = false;
                const btn = document.getElementById('btn-' + name);
                btn.textContent = 'إظهار';
                btn.classList.add('hidden');
            });
        }
        
        // إعادة تعيين الكل
        function resetAllPositions() {
            Object.keys(parts).forEach(name => resetPart(name));
        }
        
        // عرض منفصل (Explode)
        let isExploded = false;
        function explodeView() {
            if (!isExploded) {
                // تفريق الأجزاء
                Object.keys(parts).forEach((name, index) => {
                    const angle = (index / Object.keys(parts).length) * Math.PI * 2;
                    const radius = 3;
                    parts[name].position.x = Math.cos(angle) * radius;
                    parts[name].position.z = Math.sin(angle) * radius;
                    parts[name].position.y = index * 0.5;
                });
                isExploded = true;
            } else {
                // إرجاع للوضع الطبيعي
                resetAllPositions();
                isExploded = false;
            }
        }
        
        // ============================================
        // حلقة الرسم
        // ============================================
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }
        
        // بدء التشغيل
        init();
    </script>
</body>
</html>
